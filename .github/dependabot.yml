# Docs: <https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/customizing-dependency-updates>
#
# Dependabot owns EVERY ecosystem here. The npm and cargo entries below were
# commented out, and `.github/renovate.json` was written on the assumption that
# Renovate would cover npm instead. It did not: Renovate is not installed on
# this repository (no Renovate PRs, no Renovate branches), and Issues are
# disabled, so the dependency dashboard its config gated every npm update behind
# could not exist. The result was that nothing watched dependencies at all —
# which is how 22 npm advisories (10 high, including arbitrary JS execution from
# a malicious PDF) and four Rust advisories accumulated unnoticed. That config
# file was deleted on 2026-08-13; this file is now the only one.
#
# Note that this file governs *version* updates only. Dependabot *security*
# updates are a repository setting; both alerts and automated security fixes
# were switched on for this repo and for coffeegrind123/prinny on 2026-08-11.
#
# If Renovate is ever actually installed, remove the competing ecosystem from
# this file in the same change — never run both on one manifest.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5

  # cargo audit found real advisories in this tree (rustls-webpki certificate
  # path validation, quinn-proto remote memory exhaustion). It is gated in CI,
  # so a bump nobody proposes is a red build nobody can fix.
  - package-ecosystem: cargo
    directory: /src-tauri/
    schedule:
      interval: weekly
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5
