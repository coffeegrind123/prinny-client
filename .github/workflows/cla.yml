name: 'CLA Assistant'
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# `pull_request_target` and `issue_comment` are both triggerable by anyone who
# can open a PR or leave a comment, and they run with a token against the BASE
# repo — so the token scope is the blast radius. Explicit least privilege:
#
#   contents: read       — the action's README says contents may be `read` when
#                          the signatures file lives in a remote repository,
#                          which it does here (remote-organization-name /
#                          remote-repository-name below). Those writes go
#                          through CLA_PAT, not GITHUB_TOKEN, so the workflow
#                          token never needs write on this repo.
#   pull-requests: write — the bot's "please sign the CLA" comment on the PR.
#   actions: read        — after everyone has signed the action looks up its own
#                          workflow and the branch's runs to decide whether the
#                          failed CLA check needs re-running. Read is enough to
#                          keep the job green; the re-run itself needs a PAT
#                          anyway (see the action's pullRerunRunner source), so
#                          `actions: write` is deliberately NOT granted.
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: 'CLA Assistant'
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Beta Release
        uses: cla-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CLA_PAT must be scoped to the SIGNATURES REPOSITORY ONLY
          # (cinnyapp/cla — contents: write on that one repo, nothing else).
          # A classic PAT with blanket `repo` scope hands every repository the
          # token owner can reach to a workflow that outsiders can trigger via
          # pull_request_target / issue_comment. Use a fine-grained PAT.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: 'signatures.json'
          path-to-document: 'https://github.com/cinnyapp/cla/blob/main/cla.md' # e.g. a CLA or a DCO document
          # branch should not be protected
          branch: 'main'
          allowlist: ajbura,bot*

          #below are the optional inputs - If the optional inputs are not given, then default values will be taken
          remote-organization-name: cinnyapp
          remote-repository-name: cla
          #create-file-commit-message: 'For example: Creating file for storing CLA Signatures'
          #signed-commit-message: 'For example: $contributorName has signed the CLA in #$pullRequestNo'
          #custom-notsigned-prcomment: 'pull request comment with Introductory message to ask new contributors to sign'
          #custom-pr-sign-comment: 'The signature to be committed in order to sign the CLA'
          #custom-allsigned-prcomment: 'pull request comment when all contributors has signed, defaults to **CLA Assistant Lite bot** All Contributors have signed the CLA.'
          #lock-pullrequest-aftermerge: false - if you don't want this bot to automatically lock the pull request after merging (default - true)
          #use-dco-flag: true - If you are using DCO instead of CLA
