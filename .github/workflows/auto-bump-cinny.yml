name: Auto-bump cinny submodule

# Reactive submodule bump. Fires when coffeegrind123/prinny's publish-webapp
# workflow finishes a successful build and dispatches `cinny-pushed`. Updates
# the cinny gitlink to the current head of coffeegrind123/prinny:main.
#
# Commits with `[skip ci]` so we don't auto-release the desktop client on
# every cinny change — the pointer just stays current. A real desktop release
# happens on the next non-[skip ci] commit to main, which carries the
# accumulated cinny changes.
#
# Manual trigger (workflow_dispatch) is also wired up so the bump can be
# forced from the Actions tab if the dispatch path is misconfigured.

on:
  repository_dispatch:
    types: [cinny-pushed]
  workflow_dispatch:

concurrency:
  group: auto-bump-cinny
  cancel-in-progress: false

jobs:
  bump:
    name: Bump cinny gitlink if upstream moved
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to ask build.yml to run. Without it the dispatch below 403s and
      # the release is silently skipped again, which is the bug this closes.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No submodules: true — we only update the recorded SHA, not the worktree.

      - name: Resolve latest cinny SHA
        id: cinny
        run: |
          set -euo pipefail
          SHA=$(git ls-remote https://github.com/coffeegrind123/prinny.git main | awk '{print $1}')
          if [ -z "$SHA" ]; then
            echo "::error::Failed to resolve cinny main HEAD"
            exit 1
          fi
          # This value comes from a remote we do not control and is fed straight
          # into `git update-index --cacheinfo` below. Anything that is not a
          # bare 40-hex object id (multiple refs matched, an error line, shell
          # metacharacters) must not get that far.
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::cinny HEAD is not a 40-hex SHA: '$SHA'"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "Latest cinny SHA: $SHA"

      - name: Update gitlink if it moved
        id: bump
        env:
          NEW_SHA: ${{ steps.cinny.outputs.sha }}
          NEW_SHORT: ${{ steps.cinny.outputs.short }}
        run: |
          set -euo pipefail
          # Re-validate: the value crossed a step boundary via GITHUB_OUTPUT.
          if ! printf '%s' "$NEW_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Refusing to bump: NEW_SHA is not a 40-hex SHA: '$NEW_SHA'"
            exit 1
          fi
          OLD_SHA=$(git ls-tree HEAD -- cinny | awk '{print $3}')
          OLD_SHORT="${OLD_SHA:0:8}"
          if [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "Already at $NEW_SHORT — nothing to bump"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Bumping cinny: $OLD_SHORT -> $NEW_SHORT"

          # Update the submodule's gitlink without checking out the worktree.
          # Mode 160000 is git's special marker for submodule entries.
          git update-index --cacheinfo "160000,$NEW_SHA,cinny"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-bump cinny submodule to $NEW_SHORT [skip ci]"
          git push origin main
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The bump commit carries [skip ci] on purpose — a webapp change should
      # not fire every workflow in this repo on push — but that left nothing to
      # cut a desktop release. The convention was that a human would follow up
      # with an "Update cinny submodule" commit, which both released and
      # recorded what shipped; once this workflow started winning that race the
      # pointer was already current, so that commit became a no-op that could
      # not be made, and releases stranded silently. 3d165e29 only shipped
      # because unrelated Rust work happened to land on top of it.
      #
      # Requesting the build here keeps "the pointer moved" and "a build went
      # out" as one event. workflow_dispatch is one of the two events GITHUB_TOKEN
      # is allowed to raise (the other being repository_dispatch), so this needs
      # no PAT; the recursion guard that blocks token-raised `push` events does
      # not apply to it.
      #
      # `--ref main` is resolved by GitHub when the dispatch arrives, and right
      # after a push it can still resolve to the previous commit. On 2026-11-11
      # the bump to 5ab1b004 was pushed at 22:15:37 and the build dispatched at
      # 22:15:40 ran on the old d0283d3, rebuilding the commit whose Windows and
      # macOS builds had already failed. So: wait until the API serves main at
      # (or past) the commit just pushed, dispatch, then check that the build
      # it started really contains that commit, and fail loudly if not.
      - name: Release the desktop client for the new pointer
        if: steps.bump.outputs.bumped == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PUSHED: ${{ steps.bump.outputs.commit }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PUSHED" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::pushed commit is not a 40-hex SHA: '$PUSHED'"
            exit 1
          fi

          # identical: main is the pushed commit; ahead: something landed on top,
          # which still contains it. Anything else means main does not have it yet.
          contains_pushed() {
            local status
            status=$(gh api "repos/$REPO/compare/$PUSHED...$1" --jq .status 2>/dev/null) || return 1
            [ "$status" = identical ] || [ "$status" = ahead ]
          }

          WAIT_SECONDS=300
          POLL_SECONDS=5
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          until contains_pushed main; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::main still does not contain $PUSHED after ${WAIT_SECONDS}s; not dispatching a build of the old commit"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
          echo "main contains $PUSHED"

          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build.yml --repo "$REPO" --ref main

          deadline=$(( $(date +%s) + 120 ))
          while :; do
            run=$(gh run list --repo "$REPO" --workflow build.yml --event workflow_dispatch -L 5 \
              --json databaseId,headSha,createdAt \
              --jq "[.[] | select(.createdAt >= \"$since\")][0] // empty | \"\\(.databaseId) \\(.headSha)\"")
            if [ -n "$run" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::dispatched build.yml but no run appeared within 120s"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

          read -r run_id run_sha <<< "$run"
          if ! contains_pushed "$run_sha"; then
            echo "::error::build run $run_id is on $run_sha, which does not contain $PUSHED; re-run build.yml by hand"
            exit 1
          fi
          echo "build run $run_id is on $run_sha, which contains $PUSHED"
