name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Escape hatch: a run that got skipped or died partway can be re-driven
  # without inventing an empty commit just to trigger a release.
  workflow_dispatch:

# `cancel-in-progress: true` was wrong for this workflow, and it cost a release.
# create-release drafts a GitHub release and the platform jobs upload assets
# into it — side effects that a cancellation cannot undo. On 2026-08-11 two
# pushes landed minutes apart: the second cancelled the first *after* it had
# drafted v4.11.120 and uploaded three platforms, and then skipped every build
# of its own because that release already existed. Neither commit ended up with
# a complete release, and the draft was left missing its Android APK.
#
# Queue instead of cancel. A superseded build wastes runner minutes; a cancelled
# one corrupts a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Every job carries a `timeout-minutes`, because the default is SIX HOURS and
# that default cost a release. On 2026-08-19 linux-x86_64 wedged inside
# `apt-get` for 82 minutes against a 14-minute worst case; windows, macOS and
# Android had all finished and uploaded, but `release-update` waits on every
# platform job, so v4.11.185 sat as an unpublished draft while one hung step
# burned through a timeout nobody had set. Left alone it would have hung until
# 22:00Z before GitHub killed it.
#
# The numbers are ceilings derived from measured durations across the last
# twelve runs, not estimates, and every one has at least 2x headroom over the
# slowest observed success (android 36m -> 75, windows and macOS 12m -> 30,
# linux 14m -> 50 because it also has to hold its apt retry budget, everything
# else <3m -> 15-20). They are deliberately loose: this is a
# hang detector, not a performance budget, and a build that legitimately slows
# down — a cold cache, a slow runner, a big dependency bump — must not fail for
# it. If one of these ever fires on a healthy build, raise it; do not shave
# them towards the measured time.
#
# A job that trips its timeout fails, its dependents skip, and the run ends
# instead of idling for hours. The draft release it leaves behind is collected
# by the reaper at the top of the next pipeline.

# Least-privilege default for every job in this file. Jobs that genuinely need
# more (create-release, the platform builds, archive, release-update) declare
# their own `permissions:` block, which replaces this one wholesale — so the
# read-only jobs (typecheck, macos-check, security-audit) can no longer inherit
# whatever the repository default token scope happens to be.
permissions:
  contents: read

jobs:
  # ── Type check (hard gate for the entire pipeline) ───────────────
  # `vite build` strips types without checking them and nothing else ran tsc,
  # so the frontend accumulated 133 type errors unnoticed — several of which
  # were real runtime bugs (see cinny commit 66fe288d). create-release depends
  # on this job, and every platform build depends on create-release, so a
  # broken tree cannot reach a release.
  typecheck:
    runs-on: ubuntu-latest
    # Ceiling, not an estimate: measured <1m. See the note on `timeout-minutes` above.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: cinny/.node-version

      # `npm ci` and not `npm install`: only a clean install resolves the
      # lockfile's actual @types. A node_modules grown by successive installs
      # keeps stale ones hoisted and reports a false pass — that is precisely
      # how this went unnoticed locally.
      - name: Install cinny deps
        working-directory: cinny
        run: npm ci --ignore-scripts

      - name: tsc --noEmit
        working-directory: cinny
        run: npm run typecheck

      # A hook that reads a context its own component mounts passes tsc and
      # eslint and only fails at runtime — as the entire client replaced by an
      # error page on startup. That is how v4.11.177 shipped with "Server
      # versions are not provided!", so the release pipeline gates on it too
      # rather than leaving the check to the frontend repo's own workflow.
      - name: Context/provider ordering
        working-directory: cinny
        run: npm run check:contexts

  # ── Rust compile check for Apple targets (hard gate) ─────────────
  # Anything behind `#[cfg(target_os = "macos")]` is invisible to a Linux or
  # Windows `cargo check`, and it cannot be cross-checked off a Mac either —
  # ring, objc2-exception-helper and friends compile C against a real Apple
  # SDK. So macOS-only code used to reach a release having never been compiled
  # by anyone. This runs cheaply (no bundling, no npm) and gates the pipeline,
  # so a macOS-only compile error fails in minutes instead of surfacing halfway
  # through six platform builds.
  macos-check:
    runs-on: macos-latest
    # Ceiling, not an estimate: measured <1m, cold rust-cache is the slow case. See the note on `timeout-minutes` above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # tauri::generate_context! resolves frontendDist at compile time and fails
      # if ../cinny/dist is missing, so a Rust-only check still needs something
      # there. A placeholder keeps this job free of the submodule checkout and a
      # full npm ci + vite build — the assets are irrelevant to type and borrow
      # checking, which is all this job exists to do.
      - name: Placeholder frontendDist
        run: |
          mkdir -p cinny/dist
          echo '<!doctype html><title>placeholder</title>' > cinny/dist/index.html

      - name: cargo check (aarch64-apple-darwin)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-darwin

      - name: cargo check (x86_64-apple-darwin)
        working-directory: src-tauri
        run: cargo check --target x86_64-apple-darwin

  # ── Auto-create release (main push auto-versions, tag push uses tag) ──
  create-release:
    needs: [typecheck, macos-check]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Ceiling, not an estimate: measured <1m. See the note on `timeout-minutes` above.
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      created: ${{ steps.create.outputs.created }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true  # need cinny/CHANGELOG.md for release notes

      # A run that dies after create-release leaves a draft behind that nothing
      # will ever finish: release-update only publishes the draft belonging to
      # its own run. Two of them accumulated on 17.08 when GitHub's API returned
      # 503s mid-pipeline, and a stale draft is not merely clutter — the
      # "Create draft release" step below treats an existing release with the
      # computed tag as one drafted by a concurrent run and lets the platform
      # jobs upload into it, which would put this commit's binaries inside a
      # release whose notes and target point at an older one.
      #
      # Age is what separates dead from live, and it separates them cleanly: the
      # whole pipeline finishes well inside an hour (Android, the slowest, takes
      # ~40 min), so a draft still unpublished after six is from a run that is
      # never coming back. A concurrent run's draft is minutes old and untouched.
      #
      # This runs BEFORE Compute version deliberately, so a reclaimed number is
      # reused rather than skipped — a draft never created its git tag, so there
      # is nothing to collide with. Published releases are never considered.
      - name: Reap abandoned draft releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # By release ID, not tag. Drafts hold no tag, so nothing stops two of
          # them carrying the same tag_name — v4.11.138 existed twice — and
          # `gh release delete <tag>` resolves exactly one release per name, so
          # a tag-driven sweep leaves the duplicate behind and reports success.
          STALE=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.draft) | select((.created_at|fromdateiso8601) < (now - 21600)) | "\(.id) \(.tag_name)"')
          if [ -z "$STALE" ]; then
            echo "No abandoned drafts."
            exit 0
          fi
          # DELETE on the release itself, which cannot touch a tag — the
          # equivalent `gh release delete --cleanup-tag` would, on a release
          # that somehow has one, and no sweep should be able to delete tags.
          echo "$STALE" | while read -r ID TAG; do
            [ -n "$ID" ] || continue
            echo "Deleting abandoned draft $TAG (id $ID)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$ID"
          done

      # The next version must be computed from tags AND releases, not tags alone.
      # `gh release create --draft` deliberately defers creating the git tag
      # until the release is published, so a drafted-but-unpublished version is
      # invisible to `git tag`. Two runs in the same window therefore computed
      # the SAME version, and the second one bailed out with created=false
      # because the first one's draft already held that name — no build, no
      # release, silently. Taking the max of both sources is what makes back-to-
      # back pushes land on distinct versions.
      - name: Compute version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "Auto-detected tag: ${{ github.ref_name }}"
          else
            LATEST_TAG=$(git tag --sort=-v:refname | grep '^v' | head -1 || true)
            if [ -z "$LATEST_TAG" ]; then
              TAG="v4.11.1"
              echo "tag=$TAG" >> $GITHUB_OUTPUT
              echo "No existing tag — starting at $TAG"
              exit 0
            fi
            # --repo is explicit on purpose. Bare `gh release list` resolves the
            # repository from the git remote of the working directory, and this
            # checkout contains the cinny submodule — whose fork inherited
            # upstream cinny's v4.12.x releases. Resolving against it instead of
            # this repo yields a completely different, higher version line.
            #
            # Releases are also consulted ONLY within the current major.minor
            # line, so a stray release outside it can never move the product off
            # the 4.11.x line this fork versions on deliberately.
            LINE="${LATEST_TAG%.*}"
            LINE_RE="^$(printf '%s' "$LINE" | sed 's/\./\\./g')\."
            # --limit is generous because `gh release list` sorts by date, not
            # version, so the highest name has to be found locally. Drafts are
            # included by default and are exactly what we are here for.
            LATEST_REL=$(gh release list --repo "${{ github.repository }}" \
              --limit 200 --json tagName --jq '.[].tagName' \
              | grep -E "$LINE_RE" | sort -V -r | head -1 || true)
            LATEST=$(printf '%s\n%s\n' "$LATEST_TAG" "$LATEST_REL" \
              | grep '^v[0-9]' | sort -V -r | head -1)
            echo "Line $LINE — latest tag: $LATEST_TAG · latest release incl. drafts: ${LATEST_REL:-none}"
            TAG=$(echo "$LATEST" | awk -F. '{print $1"."$2"."$NF+1}')
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "Auto-bumped version: $LATEST -> $TAG"
          fi

      - name: Generate release notes
        id: notes
        run: |
          # Pulls the most-recent dated section out of cinny/CHANGELOG.md
          # (the same file the in-app changelog viewer renders). Falls back
          # to "see commit log" only if the changelog file is missing or
          # has no dated sections — every release should ship with a real
          # one written as part of the feature commit.
          node scripts/release-notes.mjs

          # Append the raw commit log too for traceability. The changelog
          # is curated; the commit log is exhaustive.
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -1)
          if [ -n "$PREV_TAG" ]; then
            printf '\n---\n\n<details><summary>All commits in this release</summary>\n\n' >> release-notes.md
            git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /' >> release-notes.md
            printf '\n</details>\n' >> release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create draft release
        # Stays a draft until release-update publishes it after every
        # platform build has uploaded its artifacts. This way `/latest/
        # download/<file>` keeps resolving to the previous release for
        # the whole build window (~45 min while Android cross-compiles)
        # instead of 404'ing on whichever platform hasn't finished yet.
        # release-update flips it to published once every platform build
        # has uploaded. Prior releases are kept (see release-update).
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — created by concurrent main-push run"
            echo "created=false" >> $GITHUB_OUTPUT
          else
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              gh release create "$TAG" \
                --draft \
                --target "${{ github.sha }}" \
                --title "Prinny Client $TAG" \
                --notes-file release-notes.md
            else
              gh release create "$TAG" \
                --draft \
                --title "Prinny Client $TAG" \
                --notes-file release-notes.md
            fi
            echo "created=true" >> $GITHUB_OUTPUT
            echo "Drafted $TAG"
          fi

  # ── Dependency security audit ───────────────────────────────────
  # Runs independently of the release jobs (no `needs`), so a flaky or
  # unfixable advisory turns the run red as a visible signal but never blocks
  # the release artifacts from building/uploading.
  security-audit:
    runs-on: ubuntu-latest
    # Ceiling, not an estimate: measured 3m. See the note on `timeout-minutes` above.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # Hard gate: no HIGH- or CRITICAL-severity vulnerabilities in SHIPPED
      # (production) deps. This used to gate on `critical` only, with `high`
      # downgraded to an advisory step because of transitive lodash advisories.
      # An advisory nobody can fail on is not a gate — if a `high` here is
      # genuinely unfixable upstream, suppress that ONE advisory explicitly
      # (npm audit's allow-list / a pinned override) rather than blinding the
      # whole gate to an entire severity class.
      - name: "npm audit — root production deps (gate: high)"
        run: npm audit --omit=dev --audit-level=high

      - name: "npm audit — cinny production deps (gate: high)"
        working-directory: cinny
        run: npm audit --omit=dev --audit-level=high

      # Rust deps via RustSec — also a real gate. `|| true` on the install line
      # meant a failed `cargo install` reported success and the audit never ran.
      #
      # Two advisories are ignored, individually and with reasons, rather than
      # lowering the gate (see the npm note above — same rule).
      #
      # RUSTSEC-2026-0194 (quadratic duplicate-attribute check) and
      # RUSTSEC-2026-0195 (unbounded namespace-declaration allocation in
      # `NsReader`) are both quick-xml DoS advisories fixed in 0.41.0. Two
      # versions remain in the tree and NEITHER can be updated from here:
      #   * 0.38.4 <- plist 1.8.0 <- tauri 2.10.3 itself (`quick-xml = "^0.38"`)
      #   * 0.37.5 <- tauri-winrt-notification 0.7.2   (`quick-xml = "^0.37"`)
      # `cargo update --precise 0.41.0` fails on both requirements.
      #
      # Checked for reachability rather than assumed:
      #   * tauri-winrt-notification uses ONLY `quick_xml::escape::escape`
      #     (9 call sites, no reader at all) to build Windows toast XML.
      #   * plist reads XML with `quick_xml::Reader`, not `NsReader`, and the
      #     only thing tauri parses with it is our own bundle's Info.plist —
      #     not remote input.
      # Neither advisory is reachable with attacker-controlled input here.
      #
      # REMOVE THESE IGNORES when tauri bumps plist, or plist/
      # tauri-winrt-notification move to quick-xml 0.41 — re-run without them
      # first and only re-add what still fires.
      - name: cargo audit (gate)
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  # ── Windows x86_64 ──────────────────────────────────────────────
  windows-x86_64:
    needs: [create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: windows-latest
    # Ceiling, not an estimate: measured 12m. See the note on `timeout-minutes` above.
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Canonical release tag, passed through to bump-version.mjs so
      # the build stamps the SAME version create-release just decided.
      # `git describe` can't see this tag yet — `gh release create
      # --draft` defers the actual git tag creation until publish.
      PRINNY_VERSION: ${{ needs.create-release.outputs.tag }}
      # Pinned NSIS artifacts, kept beside PRINNY_VERSION so the cache key
      # and the priming script below cannot drift apart. These are
      # tauri-bundler's own constants for @tauri-apps/cli 2.7.1.
      NSIS_URL: https://github.com/tauri-apps/binary-releases/releases/download/nsis-3/nsis-3.zip
      NSIS_SHA1: 057e83c7d82462ec394af76c87d06733605543d4
      NSIS_TAURI_UTILS_URL: https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.1/nsis_tauri_utils.dll
      NSIS_TAURI_UTILS_SHA1: B053B2E5FDB97257954C8F935D80964F056520AE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cinny dependencies
        run: cd cinny && npm ci --ignore-scripts
      - name: Install tauri dependencies
        run: npm ci --ignore-scripts

      - name: Bump version
        run: node scripts/bump-version.mjs

      # ── NSIS toolset, primed before the bundler can flake on it ──────
      #
      # tauri-bundler does not ship NSIS. At bundle time it fetches
      # nsis-3.zip and nsis_tauri_utils.dll from github.com and checks each
      # against a SHA1 pinned in the crate. That fetch has NO retry —
      # `download_and_verify` is one request, one chance — so a single TCP
      # reset ends the pipeline *after* the Rust build has already succeeded.
      # That is exactly how run 32242091303 died on 2026-08-19:
      #
      #     Built application at: ...\src-tauri\target\release\prinny.exe
      #     Downloading https://github.com/tauri-apps/nsis-tauri-utils/...
      #     failed to bundle project: `io: An existing connection was
      #     forcibly closed by the remote host. (os error 10054)`
      #
      # 6m26s of compilation thrown away, and v4.11.184 left as a draft with
      # 12 of 15 assets and no Windows installer. Nothing was wrong with the
      # commit — the release just could not be published.
      #
      # So fetch both artifacts here, with retries, and lay them out exactly
      # where the bundler looks. None of that layout is guessed:
      #   * tools root = `dirs::cache_dir()/tauri`, and the dirs crate maps
      #     cache_dir -> data_local_dir -> FOLDERID_LocalAppData on Windows,
      #     i.e. %LOCALAPPDATA%\tauri. tauri-cli 2.7.1 never calls
      #     `Settings::local_tools_directory`, so there is no flag to move it.
      #   * toolset = <tools>\NSIS, which the bundler produces by extracting
      #     the zip (single top-level dir `nsis-3.08`) and renaming it.
      #   * the DLL = <toolset>\Plugins\x86-unicode\additional\nsis_tauri_utils.dll
      # `$required` below is the bundler's own NSIS_REQUIRED_FILES list. It
      # checks every entry and, if ANY is missing, deletes the whole toolset
      # and re-downloads it — so priming this incompletely would be worse
      # than not priming at all, which is why the step re-checks itself at
      # the end and fails loudly rather than handing the bundler a half tree.
      #
      # The tell that this stopped working: "Verifying NSIS package" or
      # "Downloading https://..." reappearing in the Tauri build log. On a
      # primed runner the bundler prints neither.
      #
      # The SHA1s are the bundler's constants for @tauri-apps/cli 2.7.1
      # (package.json). A CLI bump can change them; that changes the cache
      # key too, and a mis-hashed file only makes the bundler re-download
      # that one file — worst case is exactly today's behaviour, never worse.
      - name: Cache NSIS toolset
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\tauri\NSIS
          key: nsis-${{ runner.os }}-${{ env.NSIS_SHA1 }}-${{ env.NSIS_TAURI_UTILS_SHA1 }}

      - name: Prime NSIS toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $tools 'NSIS'
          $dllRel = 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          $required = @(
            'makensis.exe',
            'Bin\makensis.exe',
            'Stubs\lzma-x86-unicode',
            'Stubs\lzma_solid-x86-unicode',
            'Include\MUI2.nsh',
            'Include\FileFunc.nsh',
            'Include\x64.nsh',
            'Include\nsDialogs.nsh',
            'Include\WinMessages.nsh',
            $dllRel
          )

          function Test-Toolset {
            if (-not (Test-Path -LiteralPath $nsis)) { return $false }
            foreach ($rel in $required) {
              if (-not (Test-Path -LiteralPath (Join-Path $nsis $rel))) {
                Write-Host "  missing: $rel"
                return $false
              }
            }
            # -eq on strings is case-insensitive in PowerShell, so the
            # bundler's mixed-case constants compare fine against Get-FileHash.
            $hash = (Get-FileHash -LiteralPath (Join-Path $nsis $dllRel) -Algorithm SHA1).Hash
            if ($hash -ne $env:NSIS_TAURI_UTILS_SHA1) {
              Write-Host "  nsis_tauri_utils.dll hash $hash != $env:NSIS_TAURI_UTILS_SHA1"
              return $false
            }
            return $true
          }

          function Get-Verified($url, $out, $sha1) {
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 300
                $hash = (Get-FileHash -LiteralPath $out -Algorithm SHA1).Hash
                if ($hash -eq $sha1) { return }
                Write-Output "::warning::$url hash $hash != $sha1 (attempt $attempt)"
              } catch {
                Write-Output "::warning::$url failed (attempt $attempt): $($_.Exception.Message)"
              }
              Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
              if ($attempt -lt 5) { Start-Sleep -Seconds ($attempt * 15) }
            }
            Write-Output "::error::could not fetch $url after 5 attempts"
            exit 1
          }

          if (Test-Toolset) {
            Write-Output "NSIS toolset already complete at $nsis (cache hit)"
            exit 0
          }

          Write-Output "Priming NSIS toolset at $nsis"
          Remove-Item -LiteralPath $nsis -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.zip'
          Get-Verified $env:NSIS_URL $zip $env:NSIS_SHA1
          Expand-Archive -LiteralPath $zip -DestinationPath $tools -Force
          # Matched by pattern, not hardcoded as `nsis-3.08`, so a future zip
          # that bumps the NSIS point release does not silently break this.
          $extracted = Get-ChildItem -LiteralPath $tools -Directory -Filter 'nsis-3.*' | Select-Object -First 1
          if (-not $extracted) {
            Write-Output "::error::nsis-3.zip contained no nsis-3.* directory"
            exit 1
          }
          Move-Item -LiteralPath $extracted.FullName -Destination $nsis

          $additional = Join-Path $nsis 'Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force -Path $additional | Out-Null
          Get-Verified $env:NSIS_TAURI_UTILS_URL (Join-Path $additional 'nsis_tauri_utils.dll') $env:NSIS_TAURI_UTILS_SHA1

          if (-not (Test-Toolset)) {
            Write-Output "::error::primed NSIS toolset is still incomplete: the bundler would wipe it and re-download without retries"
            exit 1
          }
          Write-Output "NSIS toolset primed at $nsis"

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config '{"bundle":{"createUpdaterArtifacts":"v1Compatible"}}'

      - name: Get version
        shell: pwsh
        run: |
          $json = (Get-Content "src-tauri\tauri.conf.json" -Raw) | ConvertFrom-Json
          "TAURI_VERSION=$($json.version)" >> $Env:GITHUB_ENV

      # ── Windows ships NSIS ONLY. The MSI is deliberately not built. ──
      #
      # `scripts/release.mjs` builds the updater manifest by matching
      # `/\.nsis\.zip$/` and `/\.nsis\.zip\.sig$/` on the release assets
      # (release.mjs:84,87,166). Nothing in the updater path has ever looked
      # at a `.msi`, so the MSI was pure build cost — and worse than free:
      #
      #   1. Tauri's MSI updater path is uninstall-then-reinstall. That drops
      #      the Start Menu shortcut and re-creates it, which breaks a taskbar
      #      pin and orphans the AppUserModelID the shortcut carries. The NSIS
      #      installer upgrades in place and leaves the shortcut alone. That
      #      AUMID is load-bearing here, not cosmetic: `lib.rs` calls
      #      SetCurrentProcessExplicitAppUserModelID with the bundle
      #      identifier so a pinned Prinny and a running Prinny are ONE
      #      taskbar button, and `send_windows_message_toast` passes the same
      #      identifier to `Toast::new` — Windows silently drops a toast whose
      #      AUMID does not match a registered shortcut. Lose the shortcut,
      #      lose the notifications, with no error anywhere.
      #   2. `src-tauri/wix/*.bmp` is still upstream Cinny artwork (blue
      #      #2A62A6, the Cinny bird), so the MSI shipped un-rebranded.
      #   3. It cost WiX toolchain download + an extra bundle pass on every
      #      Windows build for an artifact no code path consumed.
      #
      # Disabled at source in `src-tauri/tauri.conf.json`: `bundle.targets`
      # went from `"all"` to an explicit list without `"msi"`. The `wix` block
      # and `src-tauri/wix/` are intentionally KEPT so re-enabling is a
      # one-word change — put `"msi"` back in `targets` and un-comment the
      # four lines below.
      - name: Rename artifacts
        shell: pwsh
        run: |
          # Move-Item "src-tauri\target\release\bundle\msi\Prinny_${{ env.TAURI_VERSION }}_x64_en-US.msi" "src-tauri\target\release\bundle\msi\Prinny_desktop-x86_64.msi"
          Move-Item "src-tauri\target\release\bundle\nsis\Prinny_${{ env.TAURI_VERSION }}_x64-setup.exe" "src-tauri\target\release\bundle\nsis\Prinny_desktop-x86_64-setup.exe"
          Move-Item "src-tauri\target\release\bundle\nsis\Prinny_${{ env.TAURI_VERSION }}_x64-setup.nsis.zip" "src-tauri\target\release\bundle\nsis\Prinny_desktop-x86_64-setup.nsis.zip"
          Move-Item "src-tauri\target\release\bundle\nsis\Prinny_${{ env.TAURI_VERSION }}_x64-setup.nsis.zip.sig" "src-tauri\target\release\bundle\nsis\Prinny_desktop-x86_64-setup.nsis.zip.sig"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prinny-windows-x86_64
          # The `.../bundle/msi/Prinny_desktop-x86_64.msi` entry was removed
          # here, not commented out: `path:` is a YAML block scalar, so a
          # leading `#` is literal text, and @actions/glob parses these lines
          # with minimatch's `nocomment: true` (internal-pattern.ts:129) — a
          # "#"-prefixed line would be treated as a real (never-matching) glob
          # pattern, not as a comment. See the note above `Rename artifacts`.
          path: |
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.exe
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.nsis.zip
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.nsis.zip.sig
          if-no-files-found: error

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          # Keep the release as a draft — release-update flips it to
          # published once every platform job has uploaded. Without this,
          # softprops defaults to draft=false and toggles the release to
          # published on the first upload, which was the bug that left
          # `/latest/download/<file>` 404'ing for missing platforms.
          draft: true
          # MSI entry removed rather than commented — same block-scalar reason
          # as the upload-artifact step above.
          files: |
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.exe
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.nsis.zip
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.nsis.zip.sig

  # ── Linux x86_64 ────────────────────────────────────────────────
  linux-x86_64:
    needs: [create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: ubuntu-22.04
    # Ceiling, not an estimate: measured 14m, but this one is higher than its
    # siblings on purpose — it has to CONTAIN the bounded apt retries below
    # (3 attempts x 10 min worst case) plus the build itself, or the backstop
    # would kill the very retries that exist to save the release.
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      PRINNY_VERSION: ${{ needs.create-release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # This is the step that wedged for 82 minutes on 2026-08-19 and stranded a
      # finished release as an unpublished draft — every other platform had
      # already uploaded. The job's `timeout-minutes` is the backstop, but a
      # backstop alone only converts a six-hour hang into a failed release, so
      # bound each apt call directly and retry it, the way the Android build
      # already retries its Gradle dependency resolution. A stalled mirror then
      # costs a couple of minutes instead of the release.
      #
      # `timeout` and not merely a retry loop: the failure mode is a HANG, not
      # an error. apt sat there holding the step open and returning nothing, so
      # there was never a failure for a retry to react to — without a clock on
      # it, a retry loop would have waited exactly as long as the job did.
      #
      # `dpkg --configure -a` between attempts because killing apt mid-install
      # can leave a package half-configured, and the retry would then fail on
      # that rather than on whatever stalled. The package list is deliberately
      # unchanged from the plain call it replaces.
      - name: Install system deps
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get update &&
               sudo timeout 360 apt-get install -y \
                 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt stalled or failed; retrying in $((attempt * 20))s"
            sudo dpkg --configure -a || true
            sleep $((attempt * 20))
          done
          echo "::error::apt failed after 3 attempts — see the warnings above for which call stalled"
          exit 1
      - name: Install cinny dependencies
        run: cd cinny && npm ci --ignore-scripts
      - name: Install tauri dependencies
        run: npm ci --ignore-scripts

      - name: Bump version
        run: node scripts/bump-version.mjs

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config '{"bundle":{"createUpdaterArtifacts":"v1Compatible"}}'

      - name: Get version
        id: vars
        run: echo "tag=$(jq .version src-tauri/tauri.conf.json | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Rename artifacts
        run: |
          mv "src-tauri/target/release/bundle/deb/Prinny_${{ steps.vars.outputs.tag }}_amd64.deb" "src-tauri/target/release/bundle/deb/Prinny_desktop-x86_64.deb"
          mv "src-tauri/target/release/bundle/appimage/Prinny_${{ steps.vars.outputs.tag }}_amd64.AppImage" "src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage"
          mv "src-tauri/target/release/bundle/appimage/Prinny_${{ steps.vars.outputs.tag }}_amd64.AppImage.tar.gz" "src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz"
          mv "src-tauri/target/release/bundle/appimage/Prinny_${{ steps.vars.outputs.tag }}_amd64.AppImage.tar.gz.sig" "src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz.sig"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prinny-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/Prinny_desktop-x86_64.deb
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz.sig
          if-no-files-found: error

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          # Keep the release as a draft — release-update flips it to
          # published once every platform job has uploaded. Without this,
          # softprops defaults to draft=false and toggles the release to
          # published on the first upload, which was the bug that left
          # `/latest/download/<file>` 404'ing for missing platforms.
          draft: true
          files: |
            src-tauri/target/release/bundle/deb/Prinny_desktop-x86_64.deb
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz.sig

  # ── macOS universal ─────────────────────────────────────────────
  macos-universal:
    needs: [create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: macos-latest
    # Ceiling, not an estimate: measured 12m. See the note on `timeout-minutes` above.
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PRINNY_VERSION: ${{ needs.create-release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
