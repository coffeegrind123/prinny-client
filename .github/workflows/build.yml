name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job in this file. Jobs that genuinely need
# more (create-release, the platform builds, archive, release-update) declare
# their own `permissions:` block, which replaces this one wholesale — so the
# read-only jobs (typecheck, macos-check, security-audit) can no longer inherit
# whatever the repository default token scope happens to be.
permissions:
  contents: read

jobs:
  # ── Type check (hard gate for the entire pipeline) ───────────────
  # `vite build` strips types without checking them and nothing else ran tsc,
  # so the frontend accumulated 133 type errors unnoticed — several of which
  # were real runtime bugs (see cinny commit 66fe288d). create-release depends
  # on this job, and every platform build depends on create-release, so a
  # broken tree cannot reach a release.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: cinny/.node-version

      # `npm ci` and not `npm install`: only a clean install resolves the
      # lockfile's actual @types. A node_modules grown by successive installs
      # keeps stale ones hoisted and reports a false pass — that is precisely
      # how this went unnoticed locally.
      - name: Install cinny deps
        working-directory: cinny
        run: npm ci --ignore-scripts

      - name: tsc --noEmit
        working-directory: cinny
        run: npm run typecheck

  # ── Rust compile check for Apple targets (hard gate) ─────────────
  # Anything behind `#[cfg(target_os = "macos")]` is invisible to a Linux or
  # Windows `cargo check`, and it cannot be cross-checked off a Mac either —
  # ring, objc2-exception-helper and friends compile C against a real Apple
  # SDK. So macOS-only code used to reach a release having never been compiled
  # by anyone. This runs cheaply (no bundling, no npm) and gates the pipeline,
  # so a macOS-only compile error fails in minutes instead of surfacing halfway
  # through six platform builds.
  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: src-tauri

      # tauri::generate_context! resolves frontendDist at compile time and fails
      # if ../cinny/dist is missing, so a Rust-only check still needs something
      # there. A placeholder keeps this job free of the submodule checkout and a
      # full npm ci + vite build — the assets are irrelevant to type and borrow
      # checking, which is all this job exists to do.
      - name: Placeholder frontendDist
        run: |
          mkdir -p cinny/dist
          echo '<!doctype html><title>placeholder</title>' > cinny/dist/index.html

      - name: cargo check (aarch64-apple-darwin)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-darwin

      - name: cargo check (x86_64-apple-darwin)
        working-directory: src-tauri
        run: cargo check --target x86_64-apple-darwin

  # ── Auto-create release (main push auto-versions, tag push uses tag) ──
  create-release:
    needs: [typecheck, macos-check]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.create.outputs.created }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true  # need cinny/CHANGELOG.md for release notes

      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "Auto-detected tag: ${{ github.ref_name }}"
          else
            LATEST=$(git tag --sort=-v:refname | grep '^v' | head -1)
            if [ -z "$LATEST" ]; then
              TAG="v4.11.1"
            else
              TAG=$(echo "$LATEST" | awk -F. '{print $1"."$2"."$NF+1}')
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "Auto-bumped version: $LATEST -> $TAG"
          fi

      - name: Generate release notes
        id: notes
        run: |
          # Pulls the most-recent dated section out of cinny/CHANGELOG.md
          # (the same file the in-app changelog viewer renders). Falls back
          # to "see commit log" only if the changelog file is missing or
          # has no dated sections — every release should ship with a real
          # one written as part of the feature commit.
          node scripts/release-notes.mjs

          # Append the raw commit log too for traceability. The changelog
          # is curated; the commit log is exhaustive.
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -1)
          if [ -n "$PREV_TAG" ]; then
            printf '\n---\n\n<details><summary>All commits in this release</summary>\n\n' >> release-notes.md
            git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /' >> release-notes.md
            printf '\n</details>\n' >> release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create draft release
        # Stays a draft until release-update publishes it after every
        # platform build has uploaded its artifacts. This way `/latest/
        # download/<file>` keeps resolving to the previous release for
        # the whole build window (~45 min while Android cross-compiles)
        # instead of 404'ing on whichever platform hasn't finished yet.
        # release-update flips it to published once every platform build
        # has uploaded. Prior releases are kept (see release-update).
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — created by concurrent main-push run"
            echo "created=false" >> $GITHUB_OUTPUT
          else
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              gh release create "$TAG" \
                --draft \
                --target "${{ github.sha }}" \
                --title "Prinny Client $TAG" \
                --notes-file release-notes.md
            else
              gh release create "$TAG" \
                --draft \
                --title "Prinny Client $TAG" \
                --notes-file release-notes.md
            fi
            echo "created=true" >> $GITHUB_OUTPUT
            echo "Drafted $TAG"
          fi

  # ── Dependency security audit ───────────────────────────────────
  # Runs independently of the release jobs (no `needs`), so a flaky or
  # unfixable advisory turns the run red as a visible signal but never blocks
  # the release artifacts from building/uploading.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      # Hard gate: no HIGH- or CRITICAL-severity vulnerabilities in SHIPPED
      # (production) deps. This used to gate on `critical` only, with `high`
      # downgraded to an advisory step because of transitive lodash advisories.
      # An advisory nobody can fail on is not a gate — if a `high` here is
      # genuinely unfixable upstream, suppress that ONE advisory explicitly
      # (npm audit's allow-list / a pinned override) rather than blinding the
      # whole gate to an entire severity class.
      - name: "npm audit — root production deps (gate: high)"
        run: npm audit --omit=dev --audit-level=high

      - name: "npm audit — cinny production deps (gate: high)"
        working-directory: cinny
        run: npm audit --omit=dev --audit-level=high

      # Rust deps via RustSec — also a real gate. `|| true` on the install line
      # meant a failed `cargo install` reported success and the audit never ran.
      #
      # Two advisories are ignored, individually and with reasons, rather than
      # lowering the gate (see the npm note above — same rule).
      #
      # RUSTSEC-2026-0194 (quadratic duplicate-attribute check) and
      # RUSTSEC-2026-0195 (unbounded namespace-declaration allocation in
      # `NsReader`) are both quick-xml DoS advisories fixed in 0.41.0. Two
      # versions remain in the tree and NEITHER can be updated from here:
      #   * 0.38.4 <- plist 1.8.0 <- tauri 2.10.3 itself (`quick-xml = "^0.38"`)
      #   * 0.37.5 <- tauri-winrt-notification 0.7.2   (`quick-xml = "^0.37"`)
      # `cargo update --precise 0.41.0` fails on both requirements.
      #
      # Checked for reachability rather than assumed:
      #   * tauri-winrt-notification uses ONLY `quick_xml::escape::escape`
      #     (9 call sites, no reader at all) to build Windows toast XML.
      #   * plist reads XML with `quick_xml::Reader`, not `NsReader`, and the
      #     only thing tauri parses with it is our own bundle's Info.plist —
      #     not remote input.
      # Neither advisory is reachable with attacker-controlled input here.
      #
      # REMOVE THESE IGNORES when tauri bumps plist, or plist/
      # tauri-winrt-notification move to quick-xml 0.41 — re-run without them
      # first and only re-add what still fires.
      - name: cargo audit (gate)
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  # ── Windows x86_64 ──────────────────────────────────────────────
  windows-x86_64:
    needs: [create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Canonical release tag, passed through to bump-version.mjs so
      # the build stamps the SAME version create-release just decided.
      # `git describe` can't see this tag yet — `gh release create
      # --draft` defers the actual git tag creation until publish.
      PRINNY_VERSION: ${{ needs.create-release.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cinny dependencies
        run: cd cinny && npm ci --ignore-scripts
      - name: Install tauri dependencies
        run: npm ci --ignore-scripts

      - name: Bump version
        run: node scripts/bump-version.mjs

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config '{"bundle":{"createUpdaterArtifacts":"v1Compatible"}}'

      - name: Get version
        shell: pwsh
        run: |
          $json = (Get-Content "src-tauri\tauri.conf.json" -Raw) | ConvertFrom-Json
          "TAURI_VERSION=$($json.version)" >> $Env:GITHUB_ENV

      - name: Rename artifacts
        shell: pwsh
        run: |
          Move-Item "src-tauri\target\release\bundle\msi\Prinny_${{ env.TAURI_VERSION }}_x64_en-US.msi" "src-tauri\target\release\bundle\msi\Prinny_desktop-x86_64.msi"
          Move-Item "src-tauri\target\release\bundle\nsis\Prinny_${{ env.TAURI_VERSION }}_x64-setup.exe" "src-tauri\target\release\bundle\nsis\Prinny_desktop-x86_64-setup.exe"
          Move-Item "src-tauri\target\release\bundle\nsis\Prinny_${{ env.TAURI_VERSION }}_x64-setup.nsis.zip" "src-tauri\target\release\bundle\nsis\Prinny_desktop-x86_64-setup.nsis.zip"
          Move-Item "src-tauri\target\release\bundle\nsis\Prinny_${{ env.TAURI_VERSION }}_x64-setup.nsis.zip.sig" "src-tauri\target\release\bundle\nsis\Prinny_desktop-x86_64-setup.nsis.zip.sig"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prinny-windows-x86_64
          path: |
            src-tauri/target/release/bundle/msi/Prinny_desktop-x86_64.msi
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.exe
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.nsis.zip
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.nsis.zip.sig
          if-no-files-found: error

      - name: Upload to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          # Keep the release as a draft — release-update flips it to
          # published once every platform job has uploaded. Without this,
          # softprops defaults to draft=false and toggles the release to
          # published on the first upload, which was the bug that left
          # `/latest/download/<file>` 404'ing for missing platforms.
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/Prinny_desktop-x86_64.msi
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.exe
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.nsis.zip
            src-tauri/target/release/bundle/nsis/Prinny_desktop-x86_64-setup.nsis.zip.sig

  # ── Linux x86_64 ────────────────────────────────────────────────
  linux-x86_64:
    needs: [create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      PRINNY_VERSION: ${{ needs.create-release.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install cinny dependencies
        run: cd cinny && npm ci --ignore-scripts
      - name: Install tauri dependencies
        run: npm ci --ignore-scripts

      - name: Bump version
        run: node scripts/bump-version.mjs

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config '{"bundle":{"createUpdaterArtifacts":"v1Compatible"}}'

      - name: Get version
        id: vars
        run: echo "tag=$(jq .version src-tauri/tauri.conf.json | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Rename artifacts
        run: |
          mv "src-tauri/target/release/bundle/deb/Prinny_${{ steps.vars.outputs.tag }}_amd64.deb" "src-tauri/target/release/bundle/deb/Prinny_desktop-x86_64.deb"
          mv "src-tauri/target/release/bundle/appimage/Prinny_${{ steps.vars.outputs.tag }}_amd64.AppImage" "src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage"
          mv "src-tauri/target/release/bundle/appimage/Prinny_${{ steps.vars.outputs.tag }}_amd64.AppImage.tar.gz" "src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz"
          mv "src-tauri/target/release/bundle/appimage/Prinny_${{ steps.vars.outputs.tag }}_amd64.AppImage.tar.gz.sig" "src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz.sig"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prinny-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/Prinny_desktop-x86_64.deb
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz.sig
          if-no-files-found: error

      - name: Upload to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          # Keep the release as a draft — release-update flips it to
          # published once every platform job has uploaded. Without this,
          # softprops defaults to draft=false and toggles the release to
          # published on the first upload, which was the bug that left
          # `/latest/download/<file>` 404'ing for missing platforms.
          draft: true
          files: |
            src-tauri/target/release/bundle/deb/Prinny_desktop-x86_64.deb
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/Prinny_desktop-x86_64.AppImage.tar.gz.sig

  # ── macOS universal ─────────────────────────────────────────────
  macos-universal:
    needs: [create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      PRINNY_VERSION: ${{ needs.create-release.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install cinny dependencies
        run: cd cinny && npm ci --ignore-scripts
      - name: Install tauri dependencies
        run: npm ci --ignore-scripts

      - name: Bump version
        run: node scripts/bump-version.mjs

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=4096
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":"v1Compatible"}}'

      - name: Get version
        id: vars
        run: echo "tag=$(jq .version src-tauri/tauri.conf.json | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Rename artifacts
        run: |
          mv "src-tauri/target/universal-apple-darwin/release/bundle/dmg/Prinny_${{ steps.vars.outputs.tag }}_universal.dmg" "src-tauri/target/universal-apple-darwin/release/bundle/dmg/Prinny_desktop-universal.dmg"
          mv "src-tauri/target/universal-apple-darwin/release/bundle/macos/Prinny.app.tar.gz" "src-tauri/target/universal-apple-darwin/release/bundle/macos/Prinny_desktop-universal.app.tar.gz"
          mv "src-tauri/target/universal-apple-darwin/release/bundle/macos/Prinny.app.tar.gz.sig" "src-tauri/target/universal-apple-darwin/release/bundle/macos/Prinny_desktop-universal.app.tar.gz.sig"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prinny-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Prinny_desktop-universal.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Prinny_desktop-universal.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Prinny_desktop-universal.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          # Keep the release as a draft — release-update flips it to
          # published once every platform job has uploaded. Without this,
          # softprops defaults to draft=false and toggles the release to
          # published on the first upload, which was the bug that left
          # `/latest/download/<file>` 404'ing for missing platforms.
          draft: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Prinny_desktop-universal.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Prinny_desktop-universal.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Prinny_desktop-universal.app.tar.gz.sig

  # ── Android universal APK ───────────────────────────────────────
  android:
    needs: [create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PRINNY_VERSION: ${{ needs.create-release.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3.2.2
        with:
          packages: platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973

      - name: Install cinny dependencies
        run: cd cinny && npm ci --ignore-scripts
      - name: Install tauri dependencies
        run: npm ci --ignore-scripts

      - name: Bump version
        run: node scripts/bump-version.mjs

      - name: Build Android APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          CARGO_BUILD_JOBS=1 npx tauri android build

      # CRITICAL: sign every release with the SAME key. Previously this step
      # ran `keytool -genkeypair` on each run, minting a fresh random key per
      # release — so Android rejected every in-app update with "App not
      # installed" (INSTALL_FAILED_UPDATE_INCOMPATIBLE: signatures don't match
      # the installed app). The APK downloaded fine but could never install
      # over the previous one. A persistent key fixes update continuity.
      #
      # The signing key comes from repo secrets ONLY. There used to be a
      # fallback to a `prinny-ci.keystore` committed to this PUBLIC repo, with
      # the store/key password hardcoded right here — i.e. anyone could sign an
      # APK that Android would accept as an in-place update of the installed
      # app. That key is permanently compromised (it is still in git history and
      # in every already-published release) and the fallback is gone. If the
      # secrets are missing this job FAILS: no APK at all beats an APK signed
      # with a key everybody has.
      #
      # Set: ANDROID_KEYSTORE_BASE64 (`base64 -w0 your.keystore`),
      #      ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
      # Rotating the key forces existing Android users through one manual
      # reinstall (Android refuses an update signed by a different key).
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          MISSING=""
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] || MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || MISSING="$MISSING ANDROID_KEY_ALIAS"
          if [ -n "$MISSING" ]; then
            echo "::error::Android release signing secret(s) not set:$MISSING — refusing to build an unsigned or insecurely-signed APK. Configure the repository secrets and re-run."
            exit 1
          fi

          # Remove the decoded keystore on EVERY exit path, including a failed
          # apksigner run (the old unconditional `rm` after the sign command was
          # unreachable on failure, leaving the private key on the runner).
          trap 'rm -f ci-signing.keystore' EXIT

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > ci-signing.keystore
          # env: form, not pass: — a `pass:` argument is visible to every other
          # process on the runner via the process table.
          export KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks ci-signing.keystore --ks-pass env:KS_PASS \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:KS_PASS \
            --out prinny-android-universal.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose prinny-android-universal.apk | head -5
          sha256sum prinny-android-universal.apk > prinny-android-universal.apk.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prinny-android-universal
          path: |
            prinny-android-universal.apk
            prinny-android-universal.apk.sha256
          if-no-files-found: error

      - name: Upload to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          # Keep the release as a draft — release-update flips it to
          # published once every platform job has uploaded. Without this,
          # softprops defaults to draft=false and toggles the release to
          # published on the first upload, which was the bug that left
          # `/latest/download/<file>` 404'ing for missing platforms.
          draft: true
          files: |
            prinny-android-universal.apk
            prinny-android-universal.apk.sha256

  # ── Web client dist zip ─────────────────────────────────────────
  # Self-hosters who don't want to track `coffeegrind123/cinny:webapp-release`
  # via git can grab a tagged zip directly from the GitHub release. Same
  # build pipeline as the webapp-release branch (rebrand + npm run build),
  # zipped and attached as `prinny-webapp-vX.Y.Z.zip`. Extracts to a
  # directory with index.html + assets/ + sw.js etc. ready to serve.
  webapp-zip:
    needs: [create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: cinny/.node-version
          package-manager-cache: false
      - name: Install + rebrand + build
        working-directory: cinny
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          npm ci --ignore-scripts
          node scripts/rebrand.mjs
          npm run build
      - name: Zip dist
        # Stable filename — the release tag carries the version, matching
        # every other platform asset (.dmg/.msi/.exe/.AppImage/.deb).
        # `releases/latest/download/prinny-webapp.zip` resolves to
        # whatever's in the latest release.
        run: |
          cd cinny
          zip -r ../prinny-webapp.zip dist
          # Integrity control for self-hosters: the desktop artifacts ship a
          # minisign `.sig`, the APK ships a `.sha256` — this zip shipped
          # nothing, so a tampered asset was undetectable. Same pattern as the
          # android job.
          cd ..
          sha256sum prinny-webapp.zip > prinny-webapp.zip.sha256
          cat prinny-webapp.zip.sha256
      - name: Upload to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          files: |
            prinny-webapp.zip
            prinny-webapp.zip.sha256

  # ── Source archive ──────────────────────────────────────────────
  archive:
    needs: [create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
          # This job zips the whole checkout into a PUBLISHED release asset.
          # actions/checkout otherwise persists the GITHUB_TOKEN in
          # .git/config as an http.extraheader, so the token would be packaged
          # into a world-readable zip. Belt and braces with the -x below.
          persist-credentials: false
      - name: Create source zip
        run: |
          cd ..
          # Exclude git metadata: .git holds credentials (see above), and the
          # archive is meant to be a source snapshot, not a repo clone.
          zip ${{ github.event.repository.name }}/${{ github.event.repository.name }}-${{ needs.create-release.outputs.tag }}.zip ${{ github.event.repository.name }} -r \
            -x '*/.git/*' '*/.git'
      - name: Upload to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          files: |
            ${{ github.event.repository.name }}-${{ needs.create-release.outputs.tag }}.zip

  # ── Release update metadata ─────────────────────────────────────
  release-update:
    needs: [windows-x86_64, linux-x86_64, macos-universal, android, webapp-zip, archive, create-release]
    if: needs.create-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Publish the draft release
        # Every platform build has uploaded its artifacts (`needs:` above
        # makes this job wait for them). Flip the draft to published so
        # `/latest/download/<file>` switches to the new tag atomically —
        # no in-between window where some platforms are missing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false
          echo "Published $TAG"

      # Old versioned releases are NO LONGER deleted here.
      #
      # Retention decision: the deletion was not load-bearing. `release.json`
      # is generated by scripts/release.mjs, which resolves the newest `v*`
      # git TAG (repos.listTags) and then fetches that one release by tag —
      # deleting a release does not delete its tag, and nothing in the updater
      # path enumerates releases. So wiping history bought tidiness only, and
      # cost the exact evidence a supply-chain incident needs: the published
      # assets, their digests and their upload timestamps for every prior
      # version. Without them you cannot tell a tampered artifact from a
      # legitimate one after the fact, and users on an older version lose their
      # download. Keeping the releases is the security-relevant choice.
      #
      # If disk/clutter ever becomes a real problem, prune by AGE (keep at
      # least a year) instead of keeping only the current tag.

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate release.json
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Purge old workflow runs
        # Retention raised 20 -> 200. Twenty completed runs is a few days of
        # pushes; run logs are the audit trail (who triggered a build, which
        # SHA, which secrets were used) that an incident investigation depends
        # on, and `actions: write` here means the pipeline can erase its own
        # tracks. 200 keeps months of history while still bounding growth.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=200
          # --limit is required: `gh run list` returns only 20 rows by default,
          # which with KEEP=200 would silently purge nothing at all.
          gh run list --workflow=build.yml --status=completed --limit 400 --json databaseId,status --jq '.[].databaseId' \
            | tail -n +$((KEEP + 1)) \
            | while read id; do
              echo "Deleting run $id"
              gh run delete "$id" || true
            done
