# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "cinny"
version = "4.11.10"
description = "Yet another matrix client"
authors = ["Ajay Bura"]
license = "AGPL-3.0-only"
repository = "https://github.com/cinnyapp/cinny-desktop"
default-run = "cinny"
edition = "2021"
rust-version = "1.61"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.109"
serde = { version = "1.0.193", features = ["derive"] }
tauri = { version = "2", features = [ "devtools", "tray-icon"] }
tauri-plugin-localhost = "2"
tauri-plugin-window-state = "2"
# Only the plugins the frontend actually calls are compiled in. clipboard-manager,
# fs, shell, http and dialog were registered here but granted no permission in any
# capability file and called from neither Rust nor the frontend — dead IPC surface
# in every shipped binary. Removing them also drops the whole
# arboard -> wl-clipboard-rs -> wayland-client -> wayland-scanner -> quick-xml
# chain, which is what pinned quick-xml to a version with two DoS advisories
# (RUSTSEC-2026-0194/0195) that no patch release of 0.39 fixes.
tauri-plugin-notification = "2"
tauri-plugin-mobile-push = "0.1"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
# Delivers `matrix:` URIs (MSC2312) opened by another application to the
# frontend. Needed on EVERY platform, not just desktop: what differs per
# platform is only where the scheme is *registered* — from
# `plugins.deep-link.desktop.schemes` in tauri.conf.json on desktop, from the
# VIEW/BROWSABLE intent filter in AndroidManifest.xml on Android — while
# reading the launch intent and forwarding it to JS is this plugin's job
# everywhere. It used to sit in the desktop-only dependency block while
# `capabilities/mobile.json` still granted `deep-link:default`, and a capability
# naming a permission no plugin provides is a hard build failure: every Android
# CI build died in the build script with "Permission deep-link:default not
# found".
tauri-plugin-deep-link = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Async IO for the Discord-RPC bridge (src/rich_presence.rs), which binds a
# named pipe on Windows and a unix socket elsewhere. Desktop only: there is no
# RPC pipe to impersonate on a phone. The bridge builds its own current-thread
# runtime rather than borrowing Tauri's, so no feature here is assumed of it.
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Registers the app with the OS session manager so it can start at login.
# Desktop only — Android has no equivalent concept for a normal app.
tauri-plugin-autostart = "2"
# Keeps a second launch from starting a second copy of the app. Load-bearing
# with minimize-to-tray: a hidden window looks like "not running", so every
# click of the shortcut used to spawn another process.
tauri-plugin-single-instance = "2"

# Linux only, and only to reach the WebView's own settings and permission
# signals: WebKitGTK ships with `enable-media-stream` off and denies every
# permission request that has no handler connected, so getUserMedia can never
# succeed without touching both. Pinned to the exact version wry already
# resolves, so this adds no new crate to the graph — on a mismatch,
# `PlatformWebview::inner()` hands back a type from a different copy of the
# bindings and nothing compiles.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
tauri-winrt-notification = "0.7"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
