# Pins the distribution the wrapper is allowed to run. Without it the wrapper
# executes whatever ZIP the URL serves, so a compromised/redirected download
# means arbitrary code execution in every build. Value verified against both
# https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256 and
# https://gradle.org/release-checksums/ (8.14.3, binary-only -bin ZIP).
# Re-derive after any distributionUrl bump:
#   curl -sSL https://services.gradle.org/distributions/gradle-<ver>-bin.zip.sha256
distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
distributionPath=wrapper/dists
zipStorePath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
